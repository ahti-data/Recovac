# Afgeleid van ahti-data/shiny_dashboard_template (.github/workflows/deploy.yml).
# Verschillen: geen test-job, en de app staat in dashboard_iteratie_2/ in plaats van in de repo-root.
name: Deploy website via SFTP

on:
  push:
    branches:
      - main 

# Two quick pushes to main must not sync to the server out of order: the second
# run waits for the first instead of racing it.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📦 Prepare deploy folder
      run: |
        mkdir -p deploy
        # Alles uit de app-map, want app.R leest de csv/xlsx-bestanden en reg_data/ relatief
        # aan de werkmap. Alleen het R-sessiebestand blijft buiten de deploy.
        rsync -a --exclude '.Rhistory' dashboard_iteratie_2/ deploy/

    - name: ⚙️ Load deployment config
      shell: bash
      run: |
        if [ -f deploy.env ]; then
          . ./deploy.env
        fi

        if [ -z "${APP_FOLDER:-}" ] || [ "$APP_FOLDER" = "NONE" ]; then
          echo "Set APP_FOLDER in deploy.env to the dashboard folder name under /apps/."
          exit 1
        fi

        echo "REMOTE_PATH=/apps/${APP_FOLDER}/" >> "$GITHUB_ENV"

    - name: 📁 Ensure remote dashboard folder exists
      shell: bash
      env:
        SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq sshpass

        REMOTE_PATH="${{ env.REMOTE_PATH }}"
        REMOTE_PATH="${REMOTE_PATH%/}"

        # The server only accepts SFTP (no shell), so create each path
        # component via an SFTP batch; "-mkdir" ignores "already exists".
        BATCH=""
        DIR=""
        IFS='/' read -ra PARTS <<< "${REMOTE_PATH#/}"
        for PART in "${PARTS[@]}"; do
          DIR="${DIR}/${PART}"
          BATCH+="-mkdir ${DIR}"$'\n'
        done

        printf '%s' "$BATCH" | sshpass -p "$SFTP_PASSWORD" sftp \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o BatchMode=no \
          -P 22 \
          -b - \
          "${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}"

    - name: 📂 Sync files via SFTP
      uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      with:
        username: ${{ secrets.FTP_USERNAME }}
        server: ${{ secrets.FTP_SERVER }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 22
        local_path: './deploy/*'
        remote_path: ${{ env.REMOTE_PATH }}
        sftp_only: true
        delete_remote_files: false
